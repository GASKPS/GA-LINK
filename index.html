<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Link Center - GA Services</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        background: #1557a6;
        color: white;
        padding: 24px 20px;
    }

    .header-content {
        max-width: 1000px;
        margin: auto;
    }

    header h1 {
        font-size: 24px;
        margin-bottom: 5px;
    }

    header p {
        font-size: 14px;
        opacity: 0.9;
    }

    /* CONTAINER */
    .container {
        width: min(1000px, 92%);
        margin: 28px auto;
    }

    /* SEARCH */
    .search {
        width: 100%;
        padding: 13px 16px;
        border: 1px solid #d9dee7;
        border-radius: 10px;
        background: white;
        font-size: 14px;
        outline: none;
        margin-bottom: 20px;
    }

    .search:focus {
        border-color: #1557a6;
        box-shadow: 0 0 0 3px rgba(21, 87, 166, 0.08);
    }

    /* GRID */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
    }

    /* CARD */
    .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 18px;
    }

    .card h2 {
        font-size: 17px;
        color: #1f2937;
        margin-bottom: 14px;
    }

    /* BUTTON */
    .sub-buttons {
        display: grid;
        gap: 8px;
    }

    .link-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 11px 13px;

        text-decoration: none;
        color: #374151;

        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 8px;

        font-size: 14px;

        transition: 0.15s ease;
    }

    .link-btn:hover {
        background: #eef5ff;
        border-color: #b8d2f0;
        color: #1557a6;
    }

    .arrow {
        color: #1557a6;
        font-size: 14px;
    }

    /* EMPTY */
    .empty {
        display: none;
        text-align: center;
        padding: 30px;
        color: #6b7280;
        font-size: 14px;
    }

    /* FOOTER */
    footer {
        text-align: center;
        color: #9ca3af;
        font-size: 12px;
        padding: 25px 10px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
        header {
            padding: 20px 16px;
        }

        header h1 {
            font-size: 21px;
        }

        .container {
            width: 92%;
            margin: 20px auto;
        }

        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>📌 Link Center</h1>
        <p>Pusat akses link administrasi dan layanan</p>
    </div>
</header>

<main class="container">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Cari menu atau sub menu..."
    >

    <section id="menuGrid" class="grid">

        <!-- ABSENSI -->
        <div class="card menu-card">
            <h2>🕒 Absensi</h2>

            <div class="sub-buttons">

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1HrVY-KR3S9A1G4zyCACrNTi3CpVwv8lPA9aZRZpL44E/edit?pli=1&gid=1823741062#gid=1823741062"
                    target="_blank"
                >
                    <span>HJF</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1hL4rqXfFQxqFT_lzia5JpREYb215LrwUWp6COXNwJsY/edit?gid=591963174#gid=591963174"
                    target="_blank"
                >
                    <span>KPS</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/12jVB0EPW8ODIsLhLWCQOW6ojQIEK3gyz3tAGl1zzAkU/edit?gid=1489172358#gid=1489172358"
                    target="_blank"
                >
                    <span>OST</span>
                    <span class="arrow">↗</span>
                </a>

            </div>
        </div>


        <!-- DATA COS -->
        <div class="card menu-card">
            <h2>📊 Data COS</h2>

            <div class="sub-buttons">

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1Z3ZwrcVtO6r1lXjq0LJ7bfpgjDuZ31H42ZaR6pP3-KI/edit?gid=840365002#gid=840365002"
                    target="_blank"
                >
                    <span>HJF</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1e4D6sMx--I4Hb35WQpvIRdNlfArXRuAJRZkjEtoUdmI/edit?gid=0#gid=0"
                    target="_blank"
                >
                    <span>KPS</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://contoh.com/jadwal-cos"
                    target="_blank"
                >
                    <span>OST</span>
                    <span class="arrow">↗</span>
                </a>

            </div>
        </div>


        <!-- FORM IZIN -->
        <div class="card menu-card">
            <h2>👆 Form Izin Tidak Finger</h2>

            <div class="sub-buttons">

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1NDYGCCB6EKoDyxUSZE8voHG3NA4zTJM7ciB077DP0ak/edit?gid=578650227#gid=578650227"
                    target="_blank"
                >
                    <span>HJF</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1TbQt_SXYLuC1GYlVYaSJSsyMKgFGXn2Dg8WLXsZJ44k/edit?gid=1811805796#gid=1811805796"
                    target="_blank"
                >
                    <span>KPS</span>
                    <span class="arrow">↗</span>
                </a>

                <a
                    class="link-btn"
                    href="https://docs.google.com/spreadsheets/d/1mTRvxUeipaizqydVTYbuDU_1OXGW1vnQm36vkGlt08E/edit?gid=1157744393#gid=1157744393"
                    target="_blank"
                >
                    <span>OST</span>
                    <span class="arrow">↗</span>
                </a>

            </div>
        </div>

    </section>

    <div id="empty" class="empty">
        Tidak ada menu yang ditemukan.
    </div>

</main>

<footer>
    © 2026 HKOC · HJF · KPS · OST · CKM
</footer>


<script>
    const search = document.getElementById("search");
    const cards = document.querySelectorAll(".menu-card");
    const empty = document.getElementById("empty");

    search.addEventListener("input", function () {

        const keyword = this.value.toLowerCase().trim();
        let visible = 0;

        cards.forEach(card => {

            const text = card.innerText.toLowerCase();
            const show = text.includes(keyword);

            card.style.display = show ? "" : "none";

            if (show) {
                visible++;
            }
        });

        empty.style.display = visible === 0 ? "block" : "none";
    });
</script>

</body>
</html>
